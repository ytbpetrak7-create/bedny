<!DOCTYPE html>
<html lang="cs" translate="no">
<head>
<meta name="google" content="notranslate">
<link rel="stylesheet" href="1.css">
</head>
<body>
    <div id="topBar">
        <div id="pointsDisplay"></div>
    </div>
    <div id="profilePic">P</div>
    <a href="inventory.html" id="inventoryLink">Inventář</a>

    <div class="boxes">
        <a href="prbenda.html" class="box-link">
            <img class="box-img box1" src="Snímek obrazovky 2026-04-23 174559.png">
        </a>
    </div>

<script src="script.js"></script>
<script src="user.js?ver=9"></script>
<script>
if (!getCurrentUser()) {
  window.location.href = "index.html";
} else {
  createPointsDisplay();
  checkAdmin();
  loadProfilePic();
}

async function loadProfilePic() {
  var res = await getProfile();
  if (res === "NOT_FOUND") return;
  var data = JSON.parse(res);
  if (data.profilePic) {
    var pic = document.getElementById("profilePic");
    if (pic) {
      pic.style.background = "url('" + data.profilePic + "') center/cover";
      pic.textContent = "";
    }
  } else if (data.username) {
    var pic = document.getElementById("profilePic");
    if (pic) pic.textContent = data.username.charAt(0).toUpperCase();
  }
}

async function checkAdmin() {
  var res = await isAdmin();
  if (res === "YES") {
    var a = document.createElement("a");
    a.href = "admin.html";
    a.id = "adminLink";
    a.textContent = "Admin";
    a.style.cssText = "position:fixed;bottom:20px;right:20px;color:#fff;background:#f80;padding:10px 20px;text-decoration:none;z-index:9999;font-size:16px;border-radius:5px;";
    document.body.appendChild(a);
  }
  var logout = document.createElement("button");
  logout.textContent = "Odhlásit se";
  logout.style.cssText = "position:fixed;bottom:20px;left:20px;color:#fff;background:#555;border:none;padding:10px 20px;z-index:9999;font-size:14px;border-radius:5px;cursor:pointer;";
  logout.onclick = function() { localStorage.removeItem("username"); window.location.href = "index.html"; };
  document.body.appendChild(logout);
}
</script>
</body>
</html>
