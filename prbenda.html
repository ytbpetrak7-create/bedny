<!DOCTYPE html>
<html>
<head>
<style>
body{padding:40px;padding-top:20px;}
h1{font-size:24px;margin-bottom:10px;}
.slot-wrap {
  position:relative;
  width:700px;
  height:150px;
  margin:20px auto;
  overflow:hidden;
  border-radius:12px;
  background:rgba(0,0,0,0.5);
  border:2px solid rgba(255,255,255,0.08);
  box-shadow:inset 0 0 40px rgba(0,0,0,0.6), 0 0 30px rgba(0,0,0,0.4);
}
.slot-strip {
  display:flex;
  gap:6px;
  padding:12px 10px;
  position:absolute;
  left:0;
  will-change:transform;
}
.slot-strip-vertical {
  display:flex;
  flex-direction:column;
  gap:6px;
  padding:10px 12px;
  position:absolute;
  top:0;
  will-change:transform;
}
.slot-wrap-vertical {
  position:relative;
  width:160px;
  height:150px;
  overflow:hidden;
  border-radius:12px;
  background:rgba(0,0,0,0.5);
  border:2px solid rgba(255,255,255,0.08);
  box-shadow:inset 0 0 40px rgba(0,0,0,0.6), 0 0 30px rgba(0,0,0,0.4);
  flex-shrink:0;
}
.slot-wrap-vertical .slot-indicator-v {
  position:absolute;
  left:-2px;
  top:50%;
  transform:translateY(-50%);
  width:0;height:0;
  border-top:14px solid transparent;
  border-bottom:14px solid transparent;
  border-left:14px solid #ffd700;
  filter:drop-shadow(0 0 6px rgba(255,215,0,0.8));
  z-index:3;
  pointer-events:none;
}
.slot-wrap-vertical .slot-card-v {
  flex-shrink:0;
  width:120px;
  height:130px;
  background:rgba(255,255,255,0.04);
  border-radius:8px;
  padding:6px 4px;
  text-align:center;
}
.slot-wrap-vertical .slot-card-v img {
  width:90px;height:90px;
  object-fit:contain;
  display:block;
  margin:0 auto 2px;
}
.slot-wrap-vertical .slot-card-v .sname {
  color:#ccc;font-size:9px;line-height:1.1;display:block;word-break:break-word;
}
.slot-wrap-vertical .slot-card-v .sprice {
  color:#ff4444;font-size:8px;display:block;
}
.slot-wrap-vertical .slot-card-v.winner {
  background:rgba(255,215,0,0.15);
  border:2px solid #ffd700;
  box-shadow:0 0 25px rgba(255,215,0,0.6);
  animation: winGlow 1s ease-in-out infinite alternate;
}
#multiSlotContainer {
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  margin:10px auto;
}
.slot-strip .skin-card {
  flex-shrink:0;
  width:100px;
  background:rgba(255,255,255,0.04);
  border-radius:8px;
  padding:8px 4px;
  text-align:center;
}
.slot-strip .skin-card img {
  width:80px;height:80px;
  object-fit:contain;
  display:block;
  margin:0 auto 2px;
}
.slot-strip .skin-card .sname {
  color:#ccc;font-size:10px;line-height:1.1;display:block;word-break:break-word;
}
.slot-strip .skin-card .sprice {
  color:#ff4444;font-size:9px;display:block;
}
.slot-strip .skin-card.winner {
  background:rgba(255,215,0,0.15);
  border:2px solid #ffd700;
  box-shadow:0 0 25px rgba(255,215,0,0.6);
  animation: winGlow 1s ease-in-out infinite alternate;
}
@keyframes winGlow {
  from{box-shadow:0 0 10px rgba(255,215,0,0.3);}
  to{box-shadow:0 0 35px rgba(255,215,0,0.9);}
}
.slot-indicator {
  position:absolute;
  top:-2px;
  left:50%;
  transform:translateX(-50%);
  width:0;height:0;
  border-left:14px solid transparent;
  border-right:14px solid transparent;
  border-top:14px solid #ffd700;
  filter:drop-shadow(0 0 6px rgba(255,215,0,0.8));
  z-index:3;
  pointer-events:none;
}
.slot-flash {
  position:absolute;
  top:0;left:0;width:100%;height:100%;
  background:radial-gradient(circle at 50% 50%,rgba(255,215,0,0.4),transparent 70%);
  opacity:0;
  pointer-events:none;
  z-index:2;
  border-radius:10px;
}
@keyframes flashIn {
  0%{opacity:0;}
  20%{opacity:1;}
  100%{opacity:0;}
}
.skin-strip {
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:10px 0;
  margin:10px 0;
}
.skin-strip::-webkit-scrollbar { height:6px; }
.skin-strip::-webkit-scrollbar-track { background:rgba(255,255,255,0.05); border-radius:3px; }
.skin-strip::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.2); border-radius:3px; }
.skin-card {

  padding:8px;
  text-align:center;

}
.skin-card:hover { transform:scale(1.05); background:rgba(255,255,255,0.1); }
.skin-card img {

.skin-card .sname {
  color:#fff;

  line-height:1.2;

}
.skin-card .sprice {

  margin-top:2px;

#itemname {

#boxCounter {

.open-btn-wrap { text-align:center; }
#openBoxButton {

<script>
if (!getCurrentUser()) {
  window.location.href = "index.html";
} else {
  createPointsDisplay();
}

var lastItemPrice = 0;
var allItems = [];

function parseItemResult(str) {
  var last = str.lastIndexOf("|");
  var secondLast = str.lastIndexOf("|", last - 1);
  if (last === -1 || secondLast === -1) {
    var parts = str.split("|");
    return { name: parts[0] || "", img: parts[1] || "", price: Number(parts[2]) || 0 };
  }
  var price = Number(str.substring(last + 1)) || 0;
  var img = str.substring(secondLast + 1, last);
  var name = str.substring(0, secondLast);
  return { name: name, img: img, price: price };
}

var audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playTick() {
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.frequency.value = 800 + Math.random() * 400;
  o.type = "square";
  g.gain.setValueAtTime(0.08, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
  o.start(); o.stop(audioCtx.currentTime + 0.05);
}

function playWin() {
  var notes = [523, 659, 784, 1047];
  notes.forEach(function(freq, i) {
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = freq;
    o.type = "sine";
    var t = audioCtx.currentTime + i * 0.12;
    g.gain.setValueAtTime(0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    o.start(t); o.stop(t + 0.3);
  });
}

function playRare() {
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.frequency.value = 1200;
  o.type = "sawtooth";
  g.gain.setValueAtTime(0.12, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
  o.start(); o.stop(audioCtx.currentTime + 0.5);
}

function playTickFast() {
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.frequency.value = 1000 + Math.random() * 200;
  o.type = "square";
  g.gain.setValueAtTime(0.05, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
  o.start(); o.stop(audioCtx.currentTime + 0.03);
}

async function showChances() {
  var result = await getBoxInfo("Boxes1");
  allItems = JSON.parse(result);
  var html = '';
  allItems.forEach(function(item) {
    var img = item.image || '';
    if (img && !img.startsWith("http")) img = "https://ytbpetrak7-create.github.io/bedny/" + img;
    var rareStyle = item.rare ? 'border:2px solid #ff00ff;box-shadow:0 0 10px rgba(255,0,255,0.5);' : '';
    html += '<div class="skin-card" style="' + rareStyle + '">';
    if (img) { html += '<img src="' + fixImg(img) + '" alt="' + item.name + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';"><div style="width:80px;height:80px;background:rgba(255,255,255,0.1);border-radius:8px;margin:0 auto 4px;display:none;align-items:center;justify-content:center;font-size:28px;">🎁</div>'; }
    else { html += '<div style="width:80px;height:80px;background:rgba(255,255,255,0.1);border-radius:8px;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:28px;">🎁</div>'; }
    html += '<span class="sname">' + item.name + '</span>';
    html += '<span style="color:#aaa;font-size:10px;">' + item.chance + '%</span>';
    if (item.rare) { html += '<span style="color:#ff00ff;font-size:9px;">★ RARE</span>'; }
    html += '<span class="sprice">' + Number(item.sellPrice).toFixed(2) + ' Kč</span>';
    html += '</div>';
  });
  document.getElementById("skinStrip").innerHTML = html;
}

showChances();

function buildSlotStrip(winnerName, winnerImg, winnerPrice, rareMode) {
  var strip = document.getElementById("slotStrip");
  var pool = rareMode ? allItems.filter(function(x) { return x.rare; }) : allItems;
  var items = [];
  for (var i = 0; i < 35; i++) {
    var item = pool[Math.floor(Math.random() * pool.length)];
    items.push(item);
  }
  var winnerIndex = 28 + Math.floor(Math.random() * 4);
  items[winnerIndex] = { name: winnerName, image: winnerImg, sellPrice: winnerPrice };
  var html = '';
  for (var i = 0; i < items.length; i++) {
    var item = items[i];
    var img = item.image || '';
    var isWinner = (i === winnerIndex);
    html += '<div class="skin-card' + (isWinner ? ' winner' : '') + '">';
    if (img) { html += '<img src="' + fixImg(img) + '" alt="' + item.name + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';"><div style="width:80px;height:80px;background:rgba(255,255,255,0.1);border-radius:8px;margin:0 auto 2px;display:none;align-items:center;justify-content:center;font-size:24px;">🎁</div>'; }
    else { html += '<div style="width:80px;height:80px;background:rgba(255,255,255,0.1);border-radius:8px;margin:0 auto 2px;display:flex;align-items:center;justify-content:center;font-size:24px;">🎁</div>'; }
    html += '<span class="sname">' + item.name + '</span>';
    html += '<span class="sprice">' + Number(item.sellPrice).toFixed(2) + ' Kč</span>';
    html += '</div>';
  }
  strip.innerHTML = html;
  return { winnerIndex: winnerIndex, cardWidth: 106 };
}

function animateSlot(winnerIndex, cardWidth, speed) {
  speed = speed || 1;
  var animDuration = Math.round(2800 / speed);
  return new Promise(function(resolve) {
    var strip = document.getElementById("slotStrip");
    var wrap = document.getElementById("slotWrap");
    var flash = document.getElementById("slotFlash");
    var visibleCards = Math.floor(wrap.offsetWidth / cardWidth);
    var centerOffset = Math.floor(visibleCards / 2);
    var targetPos = winnerIndex - centerOffset;
    var maxX = -(targetPos * cardWidth);
    
    strip.style.transition = "none";
    strip.style.transform = "translateX(0px)";
    void strip.offsetWidth;
    
    strip.style.transition = "transform " + animDuration + "ms cubic-bezier(0.1, 0.8, 0.05, 1)";
    strip.style.transform = "translateX(" + maxX + "px)";
    
    var lastTickPos = 0;
    var startTime = performance.now();
    function tickCheck() {
      var elapsed = performance.now() - startTime;
      if (elapsed >= animDuration) return;
      var progress = elapsed / animDuration;
      var eased = 1 - Math.pow(1 - progress, 3);
      var currentPos = eased * Math.abs(maxX);
      var cardIndex = Math.floor(currentPos / cardWidth);
      if (cardIndex > lastTickPos) {
        lastTickPos = cardIndex;
        speed > 1 ? playTickFast() : playTick();
      }
      requestAnimationFrame(tickCheck);
    }
    requestAnimationFrame(tickCheck);
    
    setTimeout(function() {
      var winner = strip.querySelector(".winner");
      if (winner) {
        winner.style.transition = "transform 0.3s ease";
        winner.style.transform = "scale(1.1)";
      }
      if (flash) {
        flash.style.animation = "flashIn 0.6s ease forwards";
        setTimeout(function() { flash.style.animation = ""; }, 600);
      }
      playWin();
      resolve();
    }, animDuration + 200);
  });
}

    else { html += '<div style="width:90px;height:90px;background:rgba(255,255,255,0.1);border-radius:8px;margin:0 auto 2px;display:flex;align-items:center;justify-content:center;font-size:24px;">🎁</div>'; }
    html += '<span class="sname">' + item.name + '</span>';

    html += '</div>';

  stripEl.innerHTML = html;
  return { winnerIndex: winnerIndex, cardHeight: 136 };

async function handleRareAnimation(itemName, itemImg, itemPrice, rareMode) {
  var info = buildSlotStrip(itemName, itemImg, itemPrice, false);
  await animateSlot(info.winnerIndex, info.cardWidth);
  
  document.getElementById("itemname").innerText = "?? RARE ??";
  document.getElementById("itemname").style.color = "#ff00ff";
  playRare();
  
  var slotWrap = document.getElementById("slotWrap");
  var c4div = document.createElement("div");
  c4div.id = "c4overlay";
  c4div.style.cssText = "position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;z-index:10;background:rgba(0,0,0,0.7);border-radius:8px;";

  slotWrap.appendChild(c4div);
  
  var style = document.createElement("style");
  style.textContent = "@keyframes c4Pulse{0%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.3);filter:brightness(2) saturate(2)}100%{transform:scale(1);filter:brightness(1)}}";
  document.head.appendChild(style);
  
  await new Promise(function(r) { setTimeout(r, 1500); });
  
  var c4el = document.getElementById("c4overlay");
  if (c4el) c4el.remove();
  slotWrap.style.transition = "none";
  slotWrap.style.transform = "translateX(0px)";
  document.getElementById("slotStrip").innerHTML = "";
  
  var info2 = buildSlotStrip(itemName, itemImg, itemPrice, true);
  await animateSlot(info2.winnerIndex, info2.cardWidth);
}

var selectedResults = [];

function addItemToResults(name, img, price, index, row) {
  var container = document.getElementById("resultsContainer");
  var grid = container.querySelector(".results-grid");
  if (!grid) {
    container.innerHTML = '<div class="results-grid"></div>';
    grid = container.querySelector(".results-grid");
  }
  if (img && !img.startsWith("http")) img = "https://ytbpetrak7-create.github.io/bedny/" + img;
  var card = document.createElement("div");
  card.className = "skin-card";
  card.style.animationDelay = (index * 0.1) + "s";
  card.style.cursor = "pointer";
  card.setAttribute("data-idx", index);
  var cardHtml = '';
  if (img) { cardHtml += '<img src="' + fixImg(img) + '" alt="' + name + '" loading="lazy">'; }
  else { cardHtml += '<div style="width:80px;height:80px;background:rgba(255,255,255,0.1);border-radius:8px;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:28px;">🎁</div>'; }
  cardHtml += '<span class="sname">' + name + '</span>';
  cardHtml += '<span class="sprice">' + Number(price).toFixed(2) + ' Kč</span>';
  card.innerHTML = cardHtml;
  card.addEventListener("click", function() { toggleResultItem(card, index, name, img, price, row); });
  grid.appendChild(card);
  updateSellSelectedBtn();
}

function toggleResultItem(card, index, name, img, price, row) {
  var pos = -1;
  for (var i = 0; i < selectedResults.length; i++) {
    if (selectedResults[i].index === index) { pos = i; break; }
  }
  if (pos >= 0) {
    selectedResults.splice(pos, 1);
    card.style.borderColor = "rgba(255,255,255,0.05)";
    card.style.boxShadow = "none";
  } else {
    selectedResults.push({ index: index, name: name, img: img, price: price, row: row });
    card.style.borderColor = "#00ff96";
    card.style.boxShadow = "0 0 12px rgba(0,255,150,0.4)";
  }
  updateSellSelectedBtn();
}

function updateSellSelectedBtn() {
  var btn = document.getElementById("sellSelectedBtn");
  var wrap = document.getElementById("sellSelectedWrap");
  if (!btn || !wrap) return;
  var total = 0;
  for (var i = 0; i < selectedResults.length; i++) total += selectedResults[i].price;
  if (selectedResults.length > 0) {
    wrap.style.display = "block";
    btn.textContent = "Prodat vybrané (" + selectedResults.length + " za " + total.toFixed(2) + " Kč)";
  } else {
    wrap.style.display = "none";
  }
}

async function sellSelectedItems() {
  if (!selectedResults.length) return;
  var totalSell = 0;
  for (var i = 0; i < selectedResults.length; i++) totalSell += selectedResults[i].price;
  var el = document.getElementById("pointsDisplay");
  if (el) {
    var cur = parseFloat(el.textContent.replace("Kč:", "").trim()) || 0;
    el.textContent = "Kč: " + (cur + totalSell).toFixed(2);
  }
  for (var i = 0; i < selectedResults.length; i++) {
    var item = selectedResults[i];
    if (item.row) {
      await sellItem(item.row, item.price);
    }
  }
  selectedResults = [];
  document.getElementById("sellSelectedWrap").style.display = "none";
  document.getElementById("resultsContainer").innerHTML = "";
  document.getElementById("itemname").innerText = "";
  updatePoints();
}

document.getElementById("openBoxButton").addEventListener("click", async () => {
    document.getElementById("resultsContainer").innerHTML = "";
    document.getElementById("itemActions").style.display = "none";
    document.getElementById("itemname").innerText = "";
    document.getElementById("itemname").style.color = "#ffd700";
    document.getElementById("slotStrip").innerHTML = "";
    document.getElementById("multiSlotContainer").innerHTML = "";
    document.getElementById("slotWrap").style.display = "";
    document.getElementById("boxCounter").innerText = "";
    document.getElementById("openBoxButton").disabled = true;
    selectedResults = [];
    document.getElementById("sellSelectedWrap").style.display = "none";

    var count = parseInt(document.getElementById("openCount").value) || 1;
    var boxPrice = 2;
    var el = document.getElementById("pointsDisplay");
    if (el) {
      var cur = parseFloat(el.textContent.replace("Kč:", "").trim()) || 0;
      el.textContent = "Kč: " + (cur - boxPrice * count).toFixed(2);
    }
    
    if (count === 1) {
      var result = await open("Boxes1");
      var parsed = parseItemResult(result);
      var itemName = parsed.name, itemImg = parsed.img, itemPrice = parsed.price;
      
      var winnerItem = null;
      for (var w = 0; w < allItems.length; w++) {
        if (allItems[w].name === itemName) { winnerItem = allItems[w]; break; }
      }
      var isRare = winnerItem && Number(winnerItem.rare) === 1;
      
      if (isRare) {
        await handleRareAnimation(itemName, itemImg, itemPrice, false);
      } else {
        var info = buildSlotStrip(itemName, itemImg, itemPrice, false);
        await animateSlot(info.winnerIndex, info.cardWidth);
      }
      
      document.getElementById("itemname").innerText = itemName;
      document.getElementById("itemname").style.color = "#ffd700";
      lastItemPrice = itemPrice;
      
      var inv = JSON.parse(await getInventory());
      var found = inv.filter(function(x) { return x.name === itemName; });
      var lastItemRow = found.length > 0 ? found[found.length - 1].row : null;
      
      if (itemPrice > 0 && lastItemRow) {
        document.getElementById("sellBtn").textContent = "Prodat za " + Number(itemPrice).toFixed(2) + " Kč";
        document.getElementById("itemActions").style.display = "block";
      }
    } else {
      var result = await openMultiple("Boxes1", count);
      var items = result.split(";");
      
      document.getElementById("slotWrap").style.display = "none";
      var multiContainer = document.getElementById("multiSlotContainer");
      multiContainer.innerHTML = "";
      
      var slotData = [];
      var wrapElements = [];
      
      for (var i = 0; i < items.length; i++) {
        var parsed = parseItemResult(items[i]);
        
        var wrapDiv = document.createElement("div");
        wrapDiv.className = "slot-wrap-vertical";
        wrapDiv.innerHTML = '<div class="slot-strip-vertical" id="vStrip' + i + '"></div><div class="slot-indicator-v"></div>';
        multiContainer.appendChild(wrapDiv);
        wrapElements.push(wrapDiv);
        
        var stripEl = document.getElementById("vStrip" + i);
        var info = buildVerticalSlotStrip(stripEl, parsed.name, parsed.img, parsed.price);
        slotData.push({ strip: stripEl, wrap: wrapDiv, winnerIndex: info.winnerIndex, cardHeight: info.cardHeight, name: parsed.name, img: parsed.img, price: parsed.price });
      }
      
      var promises = slotData.map(function(sd, idx) {
        return animateVerticalSlot(sd.strip, sd.wrap, sd.winnerIndex, sd.cardHeight, 1.3);
      });
      
      await Promise.all(promises);
      
      var inv = JSON.parse(await getInventory());
      var totalValue = 0;
      for (var i = 0; i < slotData.length; i++) {
        var sd = slotData[i];
        totalValue += sd.price;
        var found = inv.filter(function(x) { return x.name === sd.name; });
        var row = found.length > 0 ? found[found.length - 1].row : null;
        addItemToResults(sd.name, sd.img, sd.price, i, row);
      }
      
      document.getElementById("itemname").innerText = "Otevřeno " + items.length + " beden";
      document.getElementById("itemname").style.color = "#ffd700";
      
      var totalHtml = '<p style="color:#aaa;text-align:center;font-size:13px;margin-top:15px;">Celkem: ' + items.length + ' itemů, hodnota ' + totalValue.toFixed(2) + ' Kč</p>';
      totalHtml += '<div style="text-align:center;margin:10px 0;"><button id="sellAllBtn" style="padding:10px 30px;background:linear-gradient(135deg,#ff4444,#cc0000);border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;">Prodat vše (' + totalValue.toFixed(2) + ' Kč)</button></div>';
      document.getElementById("resultsContainer").innerHTML += totalHtml;
      
      document.getElementById("sellAllBtn").addEventListener("click", async function() {
        var el = document.getElementById("pointsDisplay");
        if (el) {
          var cur = parseFloat(el.textContent.replace("Kč:", "").trim()) || 0;
          el.textContent = "Kč: " + (cur + totalValue).toFixed(2);
        }
        var res = await callScript("sellAll", { username: getCurrentUser() });
        if (res && res.startsWith("SOLD")) {
          updatePoints();
          document.getElementById("resultsContainer").innerHTML = "";
          document.getElementById("itemname").innerText = "";
        }
      });
    }
    
    document.getElementById("openBoxButton").disabled = false;
    updatePoints();
});

async function sellCurrentItem() {
  if (!lastItemPrice) return;
  var el = document.getElementById("pointsDisplay");
  if (el) {
    var cur = parseFloat(el.textContent.replace("Kč:", "").trim()) || 0;
    el.textContent = "Kč: " + (cur + lastItemPrice).toFixed(2);
  }
  var inv = JSON.parse(await getInventory());
  var itemname = document.getElementById("itemname").innerText;
  var found = inv.filter(function(x) { return x.name === itemname; });
  if (found.length === 0) return;
  var row = found[found.length - 1].row;
  var res = await sellItem(row, lastItemPrice);
  if (res === "SOLD") {
    document.getElementById("itemActions").style.display = "none";
    document.getElementById("itemname").innerText = "";
    updatePoints();
  }
}

function openAgain() {
  document.getElementById("resultsContainer").innerHTML = "";
  document.getElementById("itemActions").style.display = "none";
  document.getElementById("itemname").innerText = "";
  document.getElementById("slotStrip").innerHTML = "";
  document.getElementById("multiSlotContainer").innerHTML = "";
  document.getElementById("slotWrap").style.display = "";
  document.getElementById("boxCounter").innerText = "";
  selectedResults = [];
  document.getElementById("sellSelectedWrap").style.display = "none";
}
</script>
</html>
