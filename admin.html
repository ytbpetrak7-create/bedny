<!DOCTYPE html>
<html lang="cs" translate="no">
<head>`n<meta name="google" content="notranslate"><style>
body{padding:40px;padding-top:20px;}
h1{font-size:24px;margin-bottom:10px;}
h2{color:#fff;font-size:18px;margin:20px 0 10px;}
.req-item{background:#1a1a2e;border:1px solid #0f3460;border-radius:10px;padding:15px;margin:10px 0;}
.req-item p{margin:4px 0;}
.btn-app{background:#00ff96;color:#1a1a2e;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;font-weight:bold;}
.btn-done{background:#555;color:#aaa;border:none;border-radius:6px;padding:8px 16px;}
</style></head>
<body>
<a href="hlav.html" class="back-link">← Zpět</a>
<h1>Admin</h1>
<div id="adminContent"></div>
<link rel="stylesheet" href="inventory.css">
</body>
<script src="user.js?ver=6"></script>
<script>
if (!getCurrentUser()) {
  window.location.href = "index.html";
} else {
  isAdmin().then(function(res) {
    if (res !== "YES") {
      window.location.href = "hlav.html";
    } else {
      createPointsDisplay();
      loadAll();
    }
  });
}

async function loadAll() {
  var div = document.getElementById("adminContent");
  div.innerHTML = "<p style='color:#aaa;'>Načítám...</p>";
  
  var html = "<h2>Žádosti o výběr</h2>";
  var results = await Promise.all([
    callScript("getWithdrawals"),
    getTradeOffers(),
    callScript("getPendingRefCodes")
  ]);
  var wRes = results[0];
  var res = results[1];
  var refRes = results[2];
  try {
    var wItems = JSON.parse(wRes);
    if (wItems.length === 0) {
      html += "<p style='color:#aaa;'>Žádné pending žádosti</p>";
    } else {
      for (var wi = 0; wi < wItems.length; wi++) {
        var w = wItems[wi];
        var statusColor = w.status === "approved" ? "#ffd700" : w.status === "done" ? "#00ff96" : "#ff8800";
        html += '<div class="req-item">';
        html += '<p style="color:#fff;font-weight:bold;">' + w.item + '</p>';
        html += '<p style="color:#aaa;font-size:13px;">Uživatel: ' + w.username + ' | ' + new Date(w.date).toLocaleString() + '</p>';
        html += '<p style="color:' + statusColor + ';font-size:12px;">Stav: ' + w.status + '</p>';
        if (w.status === "pending") {
          html += '<button class="btn-app" onclick="approve(' + w.row + ')">Schválit</button>';
        } else if (w.status === "approved") {
          html += '<button class="btn-done" disabled>Čeká na bota</button>';
        } else if (w.status === "done") {
          html += '<button class="btn-done" disabled>Hotovo</button>';
        }
        html += '</div>';
      }
    }
  } catch (e) {
    html += "<p style='color:#f80;'>Chyba: " + e.message + "</p>";
  }
  
  html += "<h2>Žádosti o referral kódy</h2>";
  try {
    var refItems = JSON.parse(refRes);
    if (refItems.length === 0) {
      html += "<p style='color:#aaa;'>Žádné pending žádosti</p>";
    } else {
      for (var ri = 0; ri < refItems.length; ri++) {
        var r = refItems[ri];
        html += '<div class="req-item">';
        html += '<p style="color:#ffd700;font-weight:bold;font-size:18px;letter-spacing:3px;">' + r.code + '</p>';
        html += '<p style="color:#aaa;font-size:13px;">Uživatel: ' + r.username + ' | ' + new Date(r.date).toLocaleString() + '</p>';
        html += '<button class="btn-app" onclick="approveRef(' + r.row + ')">Schválit</button>';
        html += '</div>';
      }
    }
  } catch (e) {
    html += "<p style='color:#f80;'>Chyba: " + e.message + "</p>";
  }
  
  html += "<h2>Příchozí trade offeary</h2>";
  if (res === "NO_KEY" || res.indexOf("ERROR:") === 0) {
    var msg = res;
    if (res.indexOf("script.external_request") > -1) {
      msg = "Chybí autorizace Steam API.";
    }
    html += "<p style='color:#f80;'>" + msg + "</p>";
  } else {
    try {
      var data = JSON.parse(res);
      var offers = data.response && data.response.trade_offers ? data.response.trade_offers : [];
      if (offers.length === 0) {
        html += "<p style='color:#aaa;'>Žádné aktivní nabídky</p>";
      } else {
        for (var i = 0; i < offers.length; i++) {
          var o = offers[i];
          var itemsGive = o.items_to_give ? o.items_to_give.map(function(x) { return x.market_hash_name || "?"; }).join(", ") : "";
          var itemsReceive = o.items_to_receive ? o.items_to_receive.map(function(x) { return x.market_hash_name || "?"; }).join(", ") : "";
          html += '<div class="req-item">';
          html += '<p style="color:#fff;font-weight:bold;">Nabídka #' + o.tradeofferid + '</p>';
          if (itemsGive) html += '<p style="color:#00ff96;font-size:14px;">Dává: ' + itemsGive + '</p>';
          if (itemsReceive) html += '<p style="color:#f80;font-size:14px;">Dostává: ' + itemsReceive + '</p>';
          html += '<p style="color:#aaa;font-size:12px;">Stav: ' + o.state + ' | <a href="https://steamcommunity.com/tradeoffer/' + o.tradeofferid + '" target="_blank" style="color:#00ff96;">Zobrazit na Steamu</a></p>';
          html += '</div>';
        }
      }
    } catch (e) {
      html += "<p style='color:#f80;'>Chyba parsování: " + e.message + "</p>";
    }
  }

  html += "<h2>Kolo štěstí - nastavení</h2>";
  html += '<div class="req-item">';
  html += '<p style="color:#fff;font-weight:bold;">Požadovaná profilovka (URL z Steamu)</p>';
  html += '<input id="wheelPic" type="text" placeholder="https://..." style="width:100%;padding:8px;border-radius:6px;border:1px solid #0f3460;background:#0d0d1a;color:#fff;margin:8px 0;font-size:14px;">';
  html += '<p style="color:#fff;font-weight:bold;margin-top:10px;">Odměny (8 segmentů, JSON)</p>';
  html += '<textarea id="wheelPrizes" rows="6" style="width:100%;padding:8px;border-radius:6px;border:1px solid #0f3460;background:#0d0d1a;color:#fff;font-size:13px;font-family:monospace;">[{"label":"0.50 Kč","amount":0.5},{"label":"1 Kč","amount":1},{"label":"0.20 Kč","amount":0.2},{"label":"5 Kč","amount":5},{"label":"0.10 Kč","amount":0.1},{"label":"2 Kč","amount":2},{"label":"0.50 Kč","amount":0.5},{"label":"10 Kč","amount":10}]</textarea>';
  html += '<br><button class="btn-app" onclick="saveWheel()" style="margin-top:10px;">Uložit kolo</button>';
  html += ' <span id="wheelMsg" style="color:#00ff96;font-size:13px;"></span>';
  html += '</div>';
  
  div.innerHTML = html;

  var wCfg = await callScript("getWheelConfig");
  try {
    var cfg = JSON.parse(wCfg);
    if (cfg.requiredPic) document.getElementById("wheelPic").value = cfg.requiredPic;
    if (cfg.prizes && cfg.prizes.length) document.getElementById("wheelPrizes").value = JSON.stringify(cfg.prizes, null, 2);
  } catch(e) {}
}

async function approve(row) {
  await callScript("approveWithdrawal", { row: row });
  loadAll();
}

async function approveRef(row) {
  await callScript("approveRefCode", { row: row });
  loadAll();
}

async function saveWheel() {
  var pic = document.getElementById("wheelPic").value.trim();
  var prizesText = document.getElementById("wheelPrizes").value.trim();
  var msg = document.getElementById("wheelMsg");
  try {
    var prizes = JSON.parse(prizesText);
    if (!Array.isArray(prizes) || prizes.length !== 8) {
      msg.textContent = "Musí být přesně 8 odměn!";
      msg.style.color = "#f80";
      return;
    }
    await callScript("setWheelConfig", { pic: pic, prizes: JSON.stringify(prizes) });
    msg.textContent = "Uloženo!";
    msg.style.color = "#00ff96";
  } catch(e) {
    msg.textContent = "Chyba: " + e.message;
    msg.style.color = "#f80";
  }
}
</script>
</html>
