name: Deploy to Google Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'app.gs'
      - '.github/workflows/deploy-gas.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Configure clasp credentials
        run: |
          echo '${{ secrets.CLASP_CREDENTIALS }}' > ~/.clasprc.json
          chmod 600 ~/.clasprc.json
          clasp --version

      - name: Prepare GAS files (only app.gs + manifest)
        run: |
          mkdir -p gas_dist
          cp app.gs gas_dist/app.gs
          cat > gas_dist/appsscript.json <<'EOF'
          {
            "timeZone": "Europe/Prague",
            "exceptionLogging": "STACKDRIVER",
            "runtimeVersion": "V8",
            "webapp": {
              "executeAs": "USER_DEPLOYING",
              "access": "ANYONE_ANONYMOUS"
            }
          }
          EOF
          cat > .clasp.json <<EOF
          {"scriptId":"${{ secrets.GAS_SCRIPT_ID }}","rootDir":"gas_dist"}
          EOF

      - name: Push code to GAS
        run: clasp push --force

      - name: Deploy new version (all /exec URLs)
        run: |
          # Deployment ID, na ktere vedou URL pouzivane webem/botem.
          # Kdyz se URL zmeni, doplni se sem nove ID.
          ID_WEB="AKfycbz89Ud1exW-1dpUuyuO1q23upXGWEf7C5ydVBEOz3M8yDB-ZlU3GGMP8bWPqUGveq3c5Q"
          ID_SITE="AKfycbxuncRzlzuOnkPtiixn4tHw7Mj74HDeZXuOb0sB6PJimwUaOh1BeVY0aH7icR9as_Yp2Q"
          DEPLOY_ID="${{ secrets.GAS_DEPLOYMENT_ID }}"
          for ID in "$ID_WEB" "$ID_SITE" "$DEPLOY_ID"; do
            if [ -n "$ID" ]; then
              echo "Deploying to $ID"
              clasp deploy --deploymentId "$ID" -d "Auto deploy ${{ github.sha }}" || echo "WARN: deploy to $ID failed (deployment neexistuje?)"
            fi
          done
