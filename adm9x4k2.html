<!DOCTYPE html>
<html lang="cs" translate="no">

<body>
<a href="hlav.html" class="back-link">← Zpět</a>
<h1>Admin</h1>

</body>
<script src="user.js?ver=14"></script>
<script>
if (!getCurrentUser()) {
  window.location.href = "index.html";
} else {
  isAdmin().then(function(res) {
    if (res !== "YES") {
      window.location.href = "hlav.html";
    } else {
      document.body.style.display = "block";
      createPointsDisplay();
      loadAll();
    }
  });
}

async function loadAll() {
  var div = document.getElementById("adminContent");
  div.innerHTML = "<p style='color:#aaa;'>Načítám...</p>";
  
  var html = "<h2>Žádosti o výběr</h2>";
  var results = await Promise.all([
    callScript("getWithdrawals"),
    getTradeOffers(),
    callScript("getPendingRefCodes")
  ]);
  var wRes = results[0];
  var res = results[1];
  var refRes = results[2];
  try {
    var wItems = JSON.parse(wRes);
    if (wItems.length === 0) {
      html += "<p style='color:#aaa;'>Žádné pending žádosti</p>";
    } else {
      for (var wi = 0; wi < wItems.length; wi++) {
        var w = wItems[wi];
        var statusColor = w.status === "approved" ? "#ffd700" : w.status === "done" ? "#00ff96" : "#ff8800";
        html += '<div class="req-item">';
        html += '<p style="color:#fff;font-weight:bold;">' + w.item + '</p>';
        html += '<p style="color:#aaa;font-size:13px;">Uživatel: ' + w.username + ' | ' + new Date(w.date).toLocaleString() + '</p>';
        html += '<p style="color:' + statusColor + ';font-size:12px;">Stav: ' + w.status + '</p>';
        if (w.status === "pending") {
          html += '<button class="btn-app" onclick="approve(' + w.row + ')">Schválit</button>';
        } else if (w.status === "approved") {
          html += '<button class="btn-done" disabled>Čeká na bota</button>';
        } else if (w.status === "done") {
          html += '<button class="btn-done" disabled>Hotovo</button>';
        }
        html += '</div>';
      }
    }
  } catch (e) {
    html += "<p style='color:#f80;'>Chyba: " + e.message + "</p>";
  }
  
  html += "<h2>Žádosti o referral kódy</h2>";
  try {
    var refItems = JSON.parse(refRes);
    if (refItems.length === 0) {
      html += "<p style='color:#aaa;'>Žádné pending žádosti</p>";
    } else {
      for (var ri = 0; ri < refItems.length; ri++) {
        var r = refItems[ri];
        html += '<div class="req-item">';
        html += '<p style="color:#ffd700;font-weight:bold;font-size:18px;letter-spacing:3px;">' + r.code + '</p>';
        html += '<p style="color:#aaa;font-size:13px;">Uživatel: ' + r.username + ' | ' + new Date(r.date).toLocaleString() + '</p>';
        html += '<button class="btn-app" onclick="approveRef(' + r.row + ')">Schválit</button>';
        html += '</div>';
      }
    }
  } catch (e) {
    html += "<p style='color:#f80;'>Chyba: " + e.message + "</p>";
  }
  
  html += "<h2>Příchozí trade offeary</h2>";
  if (res === "NO_KEY" || res.indexOf("ERROR:") === 0) {
    var msg = res;
    if (res.indexOf("script.external_request") > -1) {
      msg = "Chybí autorizace Steam API.";
    }
    html += "<p style='color:#f80;'>" + msg + "</p>";
  } else {
    try {
      var data = JSON.parse(res);
      var offers = data.response && data.response.trade_offers ? data.response.trade_offers : [];
      if (offers.length === 0) {
        html += "<p style='color:#aaa;'>Žádné aktivní nabídky</p>";
      } else {
        for (var i = 0; i < offers.length; i++) {
          var o = offers[i];
          var itemsGive = o.items_to_give ? o.items_to_give.map(function(x) { return x.market_hash_name || "?"; }).join(", ") : "";
          var itemsReceive = o.items_to_receive ? o.items_to_receive.map(function(x) { return x.market_hash_name || "?"; }).join(", ") : "";
          html += '<div class="req-item">';
          html += '<p style="color:#fff;font-weight:bold;">Nabídka #' + o.tradeofferid + '</p>';
          if (itemsGive) html += '<p style="color:#00ff96;font-size:14px;">Dává: ' + itemsGive + '</p>';
          if (itemsReceive) html += '<p style="color:#f80;font-size:14px;">Dostává: ' + itemsReceive + '</p>';
          html += '<p style="color:#aaa;font-size:12px;">Stav: ' + o.state + ' | <a href="https://steamcommunity.com/tradeoffer/' + o.tradeofferid + '" target="_blank" style="color:#00ff96;">Zobrazit na Steamu</a></p>';
          html += '</div>';
        }
      }
    } catch (e) {
      html += "<p style='color:#f80;'>Chyba parsování: " + e.message + "</p>";
    }
  }

  html += "<h2>Kolo štěstí - nastavení</h2>";
  html += '<div class="req-item">';
  html += '<p style="color:#fff;font-weight:bold;">Požadovaná profilovka (URL z Steamu)</p>';
  html += '<input id="wheelPic" type="text" placeholder="https://..." style="width:100%;padding:8px;border-radius:6px;border:1px solid #0f3460;background:#0d0d1a;color:#fff;margin:8px 0;font-size:14px;">';
  html += '<p style="color:#fff;font-weight:bold;margin-top:10px;">Odměny (8 segmentů, JSON)</p>';
  html += '<textarea id="wheelPrizes" rows="6" style="width:100%;padding:8px;border-radius:6px;border:1px solid #0f3460;background:#0d0d1a;color:#fff;font-size:13px;font-family:monospace;">[{"label":"0.50 Kč","amount":0.5},{"label":"1 Kč","amount":1},{"label":"0.20 Kč","amount":0.2},{"label":"5 Kč","amount":5},{"label":"0.10 Kč","amount":0.1},{"label":"2 Kč","amount":2},{"label":"0.50 Kč","amount":0.5},{"label":"10 Kč","amount":10}]</textarea>';
  html += '<br><button class="btn-app" onclick="saveWheel()" style="margin-top:10px;">Uložit kolo</button>';
  html += ' <span id="wheelMsg" style="color:#00ff96;font-size:13px;"></span>';
  html += '</div>';

  html += "<h2>PriceEmpire - nastavení cen</h2>";
  html += '<div class="req-item">';
  html += '<p style="color:#fff;font-weight:bold;">API klíč (z pricempire.com/api)</p>';
  html += '<input id="peApiKey" type="password" placeholder="Bearer token..." style="width:100%;padding:8px;border-radius:6px;border:1px solid #0f3460;background:#0d0d1a;color:#fff;margin:8px 0;font-size:14px;">';
  html += '<p style="color:#fff;font-weight:bold;margin-top:10px;">Zdroj cen</p>';
  html += '<select id="peSource" style="width:100%;padding:8px;border-radius:6px;border:1px solid #0f3460;background:#0d0d1a;color:#fff;margin:8px 0;font-size:14px;">';
  html += '<option value="buff163">Buff163 (CNY)</option>';
  html += '<option value="steam">Steam Market</option>';
  html += '<option value="csfloat">CSFloat</option>';
  html += '<option value="skinport">Skinport</option>';
  html += '<option value="csmoney">CS.MONEY</option>';
  html += '<option value="dmarket">DMarket</option>';
  html += '<option value="youpin">YouPin898</option>';
  html += '<option value="csfloat">CSFloat (vlastní API)</option>';
  html += '<option value="takeskin">Take.Skin (zdarma, bez klíče) ⭐</option>';
  html += '</select>';
  html += '<p style="color:#fff;font-weight:bold;margin-top:10px;">CSFloat API klíč (pokud vybereš CSFloat)</p>';
  html += '<input id="peCsfloatKey" type="password" placeholder="CSFloat API key..." style="width:100%;padding:8px;border-radius:6px;border:1px solid #0f3460;background:#0d0d1a;color:#fff;margin:8px 0;font-size:14px;">';
  html += '<p style="color:#fff;font-weight:bold;margin-top:10px;">Měna</p>';
  html += '<select id="peCurrency" style="width:100%;padding:8px;border-radius:6px;border:1px solid #0f3460;background:#0d0d1a;color:#fff;margin:8px 0;font-size:14px;">';
  html += '<option value="CZK">CZK (Kč)</option>';
  html += '<option value="USD">USD ($)</option>';
  html += '<option value="EUR">EUR (€)</option>';
  html += '</select>';
  html += '<p style="color:#fff;font-weight:bold;margin-top:10px;">Profit násobič - bedny/prodej (1.0 = tržní cena)</p>';
  html += '<input id="peProfitMult" type="number" step="0.01" min="0.1" max="5" value="1.0" style="width:100%;padding:8px;border-radius:6px;border:1px solid #0f3460;background:#0d0d1a;color:#fff;margin:8px 0;font-size:14px;">';
  html += '<p style="color:#fff;font-weight:bold;margin-top:10px;">Deposit násobič - výkup (0.7 = vykupuješ o 30% levněji = marže)</p>';
  html += '<input id="peDepositMult" type="number" step="0.01" min="0.1" max="5" value="0.7" style="width:100%;padding:8px;border-radius:6px;border:1px solid #0f3460;background:#0d0d1a;color:#fff;margin:8px 0;font-size:14px;">';
  html += '<br><button class="btn-app" onclick="savePriceEmpire()" style="margin-top:10px;">Uložit nastavení</button>';
  html += ' <span id="peMsg" style="color:#00ff96;font-size:13px;"></span>';
  html += '<br><br><button class="btn-app" onclick="updatePrices()" style="background:#ffd700;color:#1a1a2e;">Aktualizovat ceny ze všech tabulek</button>';
  html += ' <span id="peUpdateMsg" style="color:#00ff96;font-size:13px;"></span>';
  html += '<br><br><button class="btn-app" onclick="updateImages()" style="background:#4b9aff;color:#fff;">Aktualizovat obrázky (průhledné ze Steamu)</button>';
  html += ' <span id="imgUpdateMsg" style="color:#00ff96;font-size:13px;"></span>';
  html += '</div>';

  html += "<h2>Správce beden</h2>";
  html += '<div class="req-item">';
  html += '<p style="color:#aaa;font-size:13px;">Vyber bednu a uprav její obsah: název, obrázek, šanci, cenu, rare (★) a zámek (🔒). Uložení se ihned projeví v bedně.</p>';
  html += '<select id="boxEditSelect" onchange="loadBoxEditor()" style="padding:8px;border-radius:6px;border:1px solid #0f3460;background:#0d0d1a;color:#fff;font-size:14px;">';
  html += '<option value="Boxes1">Boxes1</option>';
  html += '<option value="Boxes2">Boxes2</option>';
  html += '</select>';
  html += '<div id="boxItemsList"><p style="color:#aaa;">Načítám...</p></div>';
  html += '</div>';

  html += "<h2>Zámek webu 🔒</h2>";
  html += '<div class="req-item">';
  html += '<p style="color:#aaa;font-size:13px;">Stav: <span id="lockStatus" style="color:#ffd700;">...</span></p>';
  html += '<input id="sitePw" type="password" placeholder="Nové heslo" autocomplete="new-password" style="width:100%;padding:8px;border-radius:6px;border:1px solid #0f3460;background:#0d0d1a;color:#fff;margin:8px 0;font-size:14px;">';
  html += '<button class="btn-app" onclick="saveSitePassword()">Zamknout heslem</button> ';
  html += '<button class="btn-app" onclick="clearSitePassword()" style="background:#555;color:#fff;">Odemknout web</button>';
  html += ' <span id="lockMsg" style="color:#00ff96;font-size:13px;"></span>';
  html += '</div>';

  div.innerHTML = html;

  loadBoxEditor();

  var wCfg = await callScript("getWheelConfig");
  try {
    var cfg = JSON.parse(wCfg);
    if (cfg.requiredPic) document.getElementById("wheelPic").value = cfg.requiredPic;
    if (cfg.prizes && cfg.prizes.length) document.getElementById("wheelPrizes").value = JSON.stringify(cfg.prizes, null, 2);
  } catch(e) {}

  await loadPriceEmpireConfig();
  await loadLockStatus();
}

function escHtml(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }

var editBoxCurrent = "Boxes1";
var editBoxItems = [];
var editingRow = null;

async function loadBoxEditor() {
  var sel = document.getElementById("boxEditSelect");
  if (sel) editBoxCurrent = sel.value;
  editingRow = null;
  var list = document.getElementById("boxItemsList");
  if (list) list.innerHTML = "<p style='color:#aaa;'>Načítám...</p>";
  var res = await getBoxItemsAdmin(editBoxCurrent);
  if (res === "NOT_ADMIN") { list.innerHTML = "<p style='color:#f80;'>Nemáš oprávnění</p>"; return; }
  try { editBoxItems = JSON.parse(res); } catch(e) { editBoxItems = []; }
  renderBoxEditor();
}

function renderBoxEditor() {
  var c = document.getElementById("boxItemsList");
  if (!c) return;
  var html = '<table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;">';
  html += '<tr style="color:#888;font-size:11px;"><td style="padding:4px;">Obrázek</td><td>Název</td><td>Šance</td><td>Cena</td><td>Rare</td><td>Lock</td><td></td></tr>';
  editBoxItems.forEach(function(it) {
    if (editingRow === it.row) {
      html += '<tr><td colspan="7" style="background:#0d0d1a;padding:10px;border-radius:8px;border-top:1px solid #222;">' + editFormHTML(it, it.row) + '</td></tr>';
    } else {
      var img = it.image || "";
      if (img && !img.startsWith("http")) img = "https://ytbpetrak7-create.github.io/bedny/" + img;
      html += '<tr style="border-top:1px solid #222;">';
      html += '<td style="padding:4px;">' + (img ? '<img src="' + escHtml(img) + '" style="width:40px;height:40px;object-fit:contain;border-radius:4px;" onerror="this.style.display=\'none\'">' : '<span style="color:#555;">-</span>') + '</td>';
      html += '<td style="color:#ddd;">' + escHtml(it.name) + (it.wear ? ' <span style="color:#888;font-size:11px;">(' + escHtml(it.wear) + ')</span>' : '') + '</td>';
      html += '<td style="color:#aaa;">' + it.chance + '%</td>';
      html += '<td style="color:#00ff96;">' + Number(it.sellPrice).toFixed(2) + ' Kč</td>';
      html += '<td>' + (it.rare ? '<span style="color:#ff00ff;">★</span>' : '') + '</td>';
      html += '<td>' + (it.locked ? '<span style="color:#ff8800;">🔒</span>' : '') + '</td>';
      html += '<td style="white-space:nowrap;"><button class="btn-app" onclick="editBoxRow(' + it.row + ')" style="padding:4px 10px;font-size:12px;">Upravit</button> <button onclick="deleteBoxRow(' + it.row + ')" style="padding:4px 10px;font-size:12px;background:#f44;color:#fff;border:none;border-radius:6px;cursor:pointer;">Smazat</button></td>';
      html += '</tr>';
    }
  });
  if (editingRow === "new") {
    html += '<tr><td colspan="7" style="background:#0d0d1a;padding:10px;border-radius:8px;border-top:1px solid #222;">' + editFormHTML({}, "new") + '</td></tr>';
  }
  html += '</table>';
  html += '<br><button class="btn-app" onclick="editBoxRow(\'new\')">+ Přidat skin do bedny</button>';
  html += ' <span id="boxEditMsg" style="color:#00ff96;font-size:13px;"></span>';
  c.innerHTML = html;
}

function editFormHTML(it, row) {
  var inputStyle = "width:100%;padding:6px;border-radius:6px;border:1px solid #0f3460;background:#0d0d1a;color:#fff;font-size:13px;";
  var labelStyle = "color:#888;font-size:11px;display:block;margin-bottom:2px;";
  var h = '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;">';
  h += '<div style="flex:2;min-width:170px;"><label style="' + labelStyle + '">Název</label><input id="be_name" value="' + escHtml(it.name || "") + '" style="' + inputStyle + '"></div>';
  h += '<div style="flex:3;min-width:200px;"><label style="' + labelStyle + '">Obrázek (URL nebo název souboru)</label><input id="be_image" value="' + escHtml(it.image || "") + '" style="' + inputStyle + '"></div>';
  h += '<div style="width:85px;"><label style="' + labelStyle + '">Šance %</label><input id="be_chance" type="number" step="0.01" min="0" value="' + (it.chance || "") + '" style="' + inputStyle + '"></div>';
  h += '<div style="width:95px;"><label style="' + labelStyle + '">Cena Kč</label><input id="be_price" type="number" step="0.01" min="0" value="' + (it.sellPrice || "") + '" style="' + inputStyle + '"></div>';
  h += '<div style="width:120px;"><label style="' + labelStyle + '">Wear</label><input id="be_wear" value="' + escHtml(it.wear || "") + '" placeholder="Field-Tested" style="' + inputStyle + '"></div>';
  h += '<div style="display:flex;flex-direction:column;gap:4px;padding-top:16px;">';
  h += '<label style="color:#ff00ff;font-size:12px;cursor:pointer;"><input type="checkbox" id="be_rare"' + (it.rare ? " checked" : "") + '> ★ Rare</label>';
  h += '<label style="color:#ff8800;font-size:12px;cursor:pointer;"><input type="checkbox" id="be_locked"' + (it.locked ? " checked" : "") + '> 🔒 Zamčeno</label>';
  h += '</div>';
  h += '</div>';
  h += '<div style="margin-top:10px;"><button class="btn-app" onclick="saveBoxRow(\'' + row + '\')">' + (row === "new" ? "Přidat" : "Uložit") + '</button> <button class="btn-done" onclick="cancelBoxEdit()">Zrušit</button></div>';
  return h;
}

function editBoxRow(row) { editingRow = row; renderBoxEditor(); }
function cancelBoxEdit() { editingRow = null; renderBoxEditor(); }

function boxEditMsg(text, isError) {
  var m = document.getElementById("boxEditMsg");
  if (m) { m.textContent = text; m.style.color = isError ? "#f80" : "#00ff96"; }
}

async function saveBoxRow(row) {
  var data = {
    name: document.getElementById("be_name").value.trim(),
    image: document.getElementById("be_image").value.trim(),
    chance: document.getElementById("be_chance").value,
    sellPrice: document.getElementById("be_price").value,
    wear: document.getElementById("be_wear").value.trim(),
    rare: document.getElementById("be_rare").checked ? 1 : 0,
    locked: document.getElementById("be_locked").checked ? 1 : 0
  };
  if (!data.name) { boxEditMsg("Zadej název!", true); return; }
  var res = row === "new" ? await addBoxItem(editBoxCurrent, data) : await updateBoxItem(editBoxCurrent, row, data);
  if (res === "UPDATED" || res === "ADDED") {
    sessionStorage.removeItem("boxInfo_" + editBoxCurrent);
    editingRow = null;
    await loadBoxEditor();
    boxEditMsg("Uloženo ✓");
  } else {
    boxEditMsg("Chyba: " + res, true);
  }
}

async function deleteBoxRow(row) {
  if (!confirm("Opravdu smazat tenhle skin z bedny?")) return;
  var res = await deleteBoxItem(editBoxCurrent, row);
  if (res === "DELETED") {
    sessionStorage.removeItem("boxInfo_" + editBoxCurrent);
    editingRow = null;
    await loadBoxEditor();
    boxEditMsg("Smazáno ✓");
  } else {
    boxEditMsg("Chyba: " + res, true);
  }
}

async function loadLockStatus() {
  var st = (await callScript("sitePasswordStatus")).trim();
  document.getElementById("lockStatus").textContent = st === "SET" ? "ZAMČENO" : "odemčeno";
  document.getElementById("lockStatus").style.color = st === "SET" ? "#ff4444" : "#00ff96";
}

async function saveSitePassword() {
  var msg = document.getElementById("lockMsg");
  var pw = document.getElementById("sitePw").value;
  if (!pw || pw.length < 4) { msg.textContent = "Heslo min. 4 znaky!"; msg.style.color = "#f80"; return; }
  var r = (await callScript("setSitePassword", { password: pw })).trim();
  msg.textContent = r === "OK" ? "Zamčeno!" : "Chyba: " + r;
  msg.style.color = r === "OK" ? "#00ff96" : "#f80";
  document.getElementById("sitePw").value = "";
  await loadLockStatus();
}

async function clearSitePassword() {
  var msg = document.getElementById("lockMsg");
  await callScript("clearSitePassword");
  msg.textContent = "Web odemčen.";
  msg.style.color = "#00ff96";
  await loadLockStatus();
}

async function approve(row) {
  await callScript("approveWithdrawal", { row: row });
  loadAll();
}

async function approveRef(row) {
  await callScript("approveRefCode", { row: row });
  loadAll();
}

async function saveWheel() {
  var pic = document.getElementById("wheelPic").value.trim();
  var prizesText = document.getElementById("wheelPrizes").value.trim();
  var msg = document.getElementById("wheelMsg");
  try {
    var prizes = JSON.parse(prizesText);
    if (!Array.isArray(prizes) || prizes.length !== 8) {
      msg.textContent = "Musí být přesně 8 odměn!";
      msg.style.color = "#f80";
      return;
    }
    await callScript("setWheelConfig", { pic: pic, prizes: JSON.stringify(prizes) });
    msg.textContent = "Uloženo!";
    msg.style.color = "#00ff96";
  } catch(e) {
    msg.textContent = "Chyba: " + e.message;
    msg.style.color = "#f80";
  }
}

async function loadPriceEmpireConfig() {
  var cfg = JSON.parse(await callScript("getPriceEmpireConfig"));
  if (cfg.apiKey) document.getElementById("peApiKey").value = cfg.apiKey;
  if (cfg.source) document.getElementById("peSource").value = cfg.source;
  if (cfg.currency) document.getElementById("peCurrency").value = cfg.currency;
  if (cfg.csfloatKey) document.getElementById("peCsfloatKey").value = cfg.csfloatKey;
  if (cfg.profitMultiplier) document.getElementById("peProfitMult").value = cfg.profitMultiplier;
  if (cfg.depositMultiplier) document.getElementById("peDepositMult").value = cfg.depositMultiplier;
}

async function savePriceEmpire() {
  var msg = document.getElementById("peMsg");
  var apiKey = document.getElementById("peApiKey").value.trim();
  var source = document.getElementById("peSource").value;
  var currency = document.getElementById("peCurrency").value;
  var csfloatKey = document.getElementById("peCsfloatKey").value.trim();
  var profitMult = document.getElementById("peProfitMult").value;
  var depositMult = document.getElementById("peDepositMult").value;
  if (source !== "csfloat" && !apiKey) { msg.textContent = "Zadej API klíč!"; msg.style.color = "#f80"; return; }
  if (source === "csfloat" && !csfloatKey) { msg.textContent = "Zadej CSFloat API klíč!"; msg.style.color = "#f80"; return; }
  await callScript("setPriceEmpireConfig", { apiKey: apiKey, source: source, currency: currency, csfloatKey: csfloatKey, profitMultiplier: profitMult, depositMultiplier: depositMult });
  msg.textContent = "Uloženo!"; msg.style.color = "#00ff96";
}

async function updateImages() {
  var msg = document.getElementById("imgUpdateMsg");
  msg.textContent = "Stahuji obrázky..."; msg.style.color = "#ffd700";
  try {
    var res = JSON.parse(await callScript("updateSkinImages"));
    if (res.error) { msg.textContent = "Chyba: " + res.error; msg.style.color = "#f80"; }
    else { msg.textContent = "Hotovo! Aktualizováno: " + res.updated + " | Přeskočeno (už URL): " + res.skipped + " | Nenalezeno: " + res.notFound.length + (res.notFound.length ? " (" + res.notFound.slice(0,5).join(", ") + ")" : ""); msg.style.color = res.updated > 0 ? "#00ff96" : "#f80"; }
  } catch(e) { msg.textContent = "Běží na serveru, zkontroluj tabulku za chvíli."; msg.style.color = "#ffd700"; }
}

async function updatePrices() {
  var msg = document.getElementById("peUpdateMsg");
  var btn = document.querySelector('button[onclick="updatePrices()"]');
  if(btn) btn.disabled = true;
  msg.textContent = "Stahuji ceny, může trvat ~20s..."; msg.style.color = "#ffd700";
  var source = document.getElementById("peSource").value;
  var currency = document.getElementById("peCurrency").value;
  try {
    var raw = await callScript("updatePricesFromPriceEmpire", { source: source, currency: currency });
    var res = JSON.parse(raw);
    if (res.error) {
      msg.textContent = "Chyba: " + res.error;
      msg.style.color = "#f80";
    } else {
      msg.textContent = "Hotovo! Aktualizováno: " + res.updated + "/" + res.total + " | Chyb: " + res.errors + " | Nenalezeno: " + res.notFound.length + (res.notFound.length ? " (" + res.notFound.slice(0,3).join(", ") + ")" : "");
      msg.style.color = res.updated > 0 ? "#00ff96" : "#f80";
    }
  } catch(e) {
    msg.textContent = "Požadavek běží na serveru (CORS/timeout). Zkontroluj za 30s v tabulce, nebo spusť přes Actions → Update prices → Run workflow.";
    msg.style.color = "#ffd700";
  }
  if(btn) btn.disabled = false;
}
</script>
</html>
